name: Generate and Deploy GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # Executa todo dia à meia noite (UTC)
  workflow_dispatch:     # Permite execução manual via interface do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          # Se o 3.14 não estiver disponível para a task ainda no seu environment,
          # você pode alterar para '3.x' ou '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub Stats via Python API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python src/fetch_stats.py

      - name: Prepare build directory
        run: |
          mkdir -p dist
          cp -r public/* dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
